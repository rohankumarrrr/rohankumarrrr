name: last listened

# Rewrites the last-listened line in README.md from last.fm. Commits only when it changes.
on:
  schedule:
    - cron: "*/15 * * * *"   # GitHub may start scheduled runs late
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: last-listened
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the latest track
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_USER: imaduck2025
        run: python3 scripts/last_listened.py

      - name: Commit if it changed
        run: |
          if git diff --quiet README.md; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update last listened"
          git push
